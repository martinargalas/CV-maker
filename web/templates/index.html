<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CV maker</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>

<header class="bar">
  <h1>CV maker</h1>
  <div class="bar-actions" id="bar-actions"></div>
</header>

<p class="notice" id="notice" hidden></p>

<main class="home">

  <!-- Signed out: sign in, or make the first account. -->
  <section class="pane gate" id="gate" hidden>
    <div class="card">
      <h2 id="gate-title">Sign in</h2>
      <p class="hint" id="gate-hint"></p>
      <form id="gate-form" autocomplete="on">
        <label><span>Username</span>
          <input type="text" id="gate-username" autocomplete="username" required></label>
        <label><span>Password</span>
          <input type="password" id="gate-password" autocomplete="current-password" required></label>
        <label id="gate-code-row" hidden><span>Signup code</span>
          <input type="text" id="gate-code" autocomplete="off"></label>
        <button type="submit" class="primary" id="gate-submit">Sign in</button>
        <button type="button" class="ghost" id="gate-switch"></button>
      </form>
      <p class="hint">
        You do not need an account to make a CV — <a href="/edit">go straight to the
        form</a>. An account is only for keeping CVs here to come back to.
      </p>
    </div>
  </section>

  <!-- Signed in: the CVs you have saved. -->
  <section class="pane tiles-pane" id="tiles-pane" hidden>
    <div class="tiles-head">
      <h2>Your CVs</h2>
      <a class="button primary" href="/edit">New CV</a>
    </div>
    <div class="tiles" id="tiles"></div>
    <p class="empty" id="tiles-empty" hidden>
      Nothing saved yet. <a href="/edit">Make one</a> and press <em>Save</em>.
    </p>
  </section>

</main>

<script src="/static/home.js"></script>
</body>
</html>
