services:
  cv-maker:
    build:
      # The repo root, because the image needs template.html from there.
      context: ..
      dockerfile: web/Dockerfile
    image: cv-maker

    # Bound to the host it runs on, and nothing else, unless CV_BIND says
    # otherwise. Set CV_BIND=0.0.0.0 to reach it from the network — from a
    # stack's environment variables, say — and read the security notes in
    # README.md before you do.
    ports:
      - "${CV_BIND:-127.0.0.1}:${CV_PORT:-8000}:8000"

    environment:
      RENDER_TIMEOUT: "20"
      MAX_CONCURRENT_RENDERS: "2"
      RATE_LIMIT_PER_MINUTE: "30"
      # Set to 1 only when a reverse proxy in front sets X-Forwarded-For, or
      # rate limiting can be defeated by forging the header.
      TRUST_PROXY: "0"

    # The container is the sandbox boundary, so it is a tight one: nothing
    # gains privileges, no capabilities, and the only writable place is the
    # temporary directory the renderer cleans up after itself.
    init: true
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=512m,mode=1777

    # A browser process is expensive; keep one bad day from taking the host.
    mem_limit: 1g
    pids_limit: 512

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
